[package]
name = "github-notifications"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/dmikusa/github-notifications"
description = "A local web app for managing GitHub notifications"
homepage = "https://github.com/dmikusa/github-notifications"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
askama = "0.12"
tower-http = { version = "0.6", features = ["trace"] }
rust-embed = { version = "8", features = ["axum", "mime-guess"] }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dist]
inherits = "release"
lto = "thin"
