<div id="view" data-view="settings">
  <h2 class="view-title">Repo sets for workspace &ldquo;{{ ws }}&rdquo;</h2>

  <div id="repo-sets" class="repo-set-list">
    {% for set in repo_sets %}
    <div class="repo-set card">
      <div class="repo-set-head">
        <strong>{{ set.name }}</strong>
        <button class="danger" data-action="remove-set" data-set="{{ set.name }}">Remove</button>
      </div>
      <ul class="repo-list">
        {% for repo in set.repos %}
        <li>
          {{ repo }}
          <button data-action="remove-repo" data-set="{{ set.name }}" data-repo="{{ repo }}">x</button>
        </li>
        {% else %}
        <li class="muted">No repos.</li>
        {% endfor %}
      </ul>
    </div>
    {% else %}
    <p class="empty">No repo sets yet \u2014 add one below.</p>
    {% endfor %}
  </div>

  <h3 class="view-title">Add a repo set</h3>
  <form id="org-picker" class="filters">
    <input type="text" name="set-name" placeholder="Repo set name" required>
    <input type="text" name="org" placeholder="GitHub org, e.g. paketo-buildpacks" required>
    <button type="submit" id="load-repos">Load repos</button>
  </form>

  <div id="org-repos" hidden>
    <input type="search" id="org-filter" placeholder="Filter repos by name">
    <div id="org-repo-list" class="repo-list"></div>
    <div class="actions">
      <button id="load-more" hidden>Load more</button>
      <button id="save-set" class="primary">Save repo set</button>
    </div>
  </div>
</div>
