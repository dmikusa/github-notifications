<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>github-notifications</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">github-notifications</h1>
    <nav class="nav" id="tabs">
      <button class="tab active" data-view="queue">Queue</button>
      <button class="tab" data-view="inbox">Inbox</button>
      <button class="tab" data-view="repos">Repos</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
    <select id="ws" class="ws-select" title="Workspace" aria-label="Workspace"></select>
    <button id="add-ws" class="icon-btn" title="Add workspace" aria-label="Add workspace">+</button>
  </header>
  <div id="status" class="status">
    <span id="status-text"></span>
    <span id="sync-status">
      <button id="sync" class="icon-btn" title="Sync now" aria-label="Sync now">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 1.5v3h-3"/></svg>
      </button>
      <span id="sync-spinner" class="spinner" hidden></span>
    </span>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="flash" class="flash" hidden></div>
  <main id="view" class="main"></main>

  <dialog id="add-ws-dialog">
    <form id="add-ws-form">
      <p class="view-title">New workspace name</p>
      <input id="new-ws-name" type="text" required autofocus>
      <menu class="dialog-actions">
        <button type="button" id="add-ws-cancel">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </menu>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
