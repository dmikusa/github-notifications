<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>github-notifications</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">github-notifications</h1>
    <nav class="nav" id="tabs">
      <button class="tab active" data-view="queue">Queue</button>
      <button class="tab" data-view="inbox">Inbox</button>
      <button class="tab" data-view="repos">Repos</button>
    </nav>
    <select id="ws" class="ws-select" title="Workspace" aria-label="Workspace"></select>
    <button id="sync" title="Sync now" aria-label="Sync now">Sync</button>
  </header>
  <div id="status" class="status"></div>
  <div id="notice" class="notice" hidden></div>
  <main id="view" class="main"></main>
  <script src="/app.js"></script>
</body>
</html>
